<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PREDCOVA Cross-Fit Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a settings column on the left, results in tabs on the right; tables in journal style (rules above and below, no boxes). */
:root {
  --bg: #f4f6f8; --surface: #ffffff; --soft: #e9eef2; --ink: #17212b; --muted: #5a6672; --rule: #d3dae1;
  --accent: #0f5f78; --accent-ink: #ffffff; --good: #1d7a46; --bad: #b42318; --warn: #8a5a00;
  --s-none: #6b7682; --s-fixed: #2a78d6; --s-trial: #eb6834; --s-pool: #1baf7a; --s-oracle: #e87ba4;
  --font-body: "Avenir Next", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-head: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10161b; --surface: #182129; --soft: #212c35; --ink: #e6ebf0; --muted: #9aa7b3; --rule: #2e3a45;
  --accent: #63bcd8; --accent-ink: #0b1419; --good: #5cc98b; --bad: #ff8a7a; --warn: #e0b252;
  --s-none: #9aa7b3; --s-fixed: #3987e5; --s-trial: #d95926; --s-pool: #199e70; --s-oracle: #d55181; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #10161b; --surface: #182129; --soft: #212c35; --ink: #e6ebf0; --muted: #9aa7b3; --rule: #2e3a45;
  --accent: #63bcd8; --accent-ink: #0b1419; --good: #5cc98b; --bad: #ff8a7a; --warn: #e0b252;
  --s-none: #9aa7b3; --s-fixed: #3987e5; --s-trial: #d95926; --s-pool: #199e70; --s-oracle: #d55181; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font-body); }
.wrap { max-width: 1500px; margin: 0 auto; padding-block: 18px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--font-head); font-weight: 600; text-wrap: balance; margin: 0; }
h1 { font-size: 26px; letter-spacing: -0.01em; }
h2 { font-size: 19px; margin-top: 4px; }
h3 { font-size: 15px; margin-top: 18px; }
p { margin: 6px 0; max-width: 75ch; }
.top { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; justify-content: space-between; border-bottom: 2px solid var(--ink); padding-bottom: 10px; }
.top .sub { color: var(--muted); margin: 2px 0 0; }
.rule-note { font-size: 12.5px; color: var(--warn); border: 1px solid var(--rule); border-left: 3px solid var(--warn); background: var(--surface); padding: 5px 10px; max-width: 46ch; }
.layout { display: grid; grid-template-columns: minmax(300px, 370px) minmax(0, 1fr); gap: 20px; margin-top: 16px; align-items: start; }
@media (max-width: 920px) { .layout { grid-template-columns: minmax(0, 1fr); } }
#setup, main { min-width: 0; }
details.sec { background: var(--surface); border: 1px solid var(--rule); border-radius: 4px; margin-bottom: 8px; }
details.sec > summary { cursor: pointer; padding: 8px 12px; font-family: var(--font-head); font-size: 15px; font-weight: 600; }
details.sec > .body { padding: 2px 12px 12px; display: grid; gap: 8px; }
label.f { display: grid; gap: 2px; font-size: 12px; color: var(--muted); min-width: 0; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; }
input, select, textarea, button { font: inherit; color: var(--ink); }
input[type=text], input[type=number], select, textarea { width: 100%; min-width: 0; background: var(--bg); border: 1px solid var(--rule); border-radius: 3px; padding: 4px 6px; }
input.fx, textarea { font-family: var(--font-mono); font-size: 12.5px; }
textarea { min-height: 110px; resize: vertical; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

button:hover { border-color: var(--accent); }
button.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.mini { padding: 1px 7px; font-size: 12px; }
button:disabled { opacity: 0.5; cursor: default; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.cov, .meth { border-top: 1px solid var(--rule); padding-top: 6px; display: grid; gap: 4px; }
.cov .l1 { display: grid; grid-template-columns: 62px minmax(0, 1fr) 56px 56px auto; gap: 4px; align-items: center; }
table.cm { border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
table.cm th, table.cm td { padding: 2px 3px; text-align: center; color: var(--muted); font-weight: 400; }
table.cm input { width: 58px; padding: 2px 3px; font-size: 12px; text-align: center; }
.meth .fm { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; line-height: 1.45; }
.grp { border-top: 1px solid var(--rule); padding-top: 6px; display: grid; gap: 4px; } .grp > b { font-size: 12.5px; font-weight: 600; }
details.adv > summary { cursor: pointer; font-size: 12px; color: var(--muted); } details.adv > .row { margin-top: 6px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin: 12px 0 6px; }
.card { border: 1px solid var(--rule); border-top: 3px solid var(--accent); border-radius: 4px; padding: 10px 12px; background: var(--bg); min-width: 0; }
.card .k { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
.card .big { font-family: var(--font-head); font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
.card p { margin: 4px 0 0; font-size: 13px; }
details.tech { margin-top: 16px; border-top: 1px solid var(--rule); padding-top: 8px; } details.tech > summary { cursor: pointer; font-family: var(--font-head); font-weight: 600; font-size: 15px; }
.meth .l1 { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px; align-items: center; }
.meth .l2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 4px; }
.meth select { font-size: 12px; padding: 2px 4px; }
.hint { font-size: 12px; color: var(--muted); margin: 0; }
.err { color: var(--bad); font-size: 13px; margin: 4px 0; white-space: pre-wrap; }
.tabs { display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 1px solid var(--rule); margin-bottom: 14px; }
.tabs button { border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: none; padding: 7px 13px; color: var(--muted); }
.tabs button[aria-selected=true] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 4px; padding: 14px 16px 18px; }
.tw { overflow-x: auto; margin: 8px 0; }

table.j th { text-align: right; font-weight: 600; padding: 5px 10px; border-bottom: 1px solid var(--ink); white-space: nowrap; vertical-align: bottom; }
table.j td { text-align: right; padding: 3px 10px; white-space: nowrap; }
table.j th:first-child, table.j td:first-child { text-align: left; padding-left: 2px; }
table.j td.wrapok { white-space: normal; min-width: 22ch; text-align: left; }
table.j tr.refrow td { background: var(--soft); }
.cap { font-size: 12.5px; color: var(--muted); max-width: 95ch; margin: 4px 0 0; }
.pass { color: var(--good); font-weight: 600; } .fail { color: var(--bad); font-weight: 600; }
svg.ch { width: 100%; height: auto; display: block; max-width: 820px; }
svg.ch text { font-family: var(--font-body); font-size: 12px; fill: var(--muted); }
svg.ch .ax { stroke: var(--rule); stroke-width: 1; fill: none; }
svg.ch .lab { fill: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; margin: 6px 0; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
progress { width: 100%; height: 8px; accent-color: var(--accent); }
#tip { position: fixed; z-index: 20; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 4px 8px; border-radius: 3px; max-width: 320px; white-space: pre-line; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 22px; font-size: 13px; font-variant-numeric: tabular-nums; }
.facts b { font-weight: 600; }
.guide h3 { margin-top: 20px; } .guide li { margin: 3px 0; max-width: 75ch; } .guide code, .mono { font-family: var(--font-mono); font-size: 12.5px; }
.logitem { border-top: 1px solid var(--rule); padding: 8px 0; }
</style>

<body>


<div class="wrap">
  <div class="top">
    <div>
      <h1>PREDCOVA Cross-Fit Lab</h1>
      <p class="sub">Simulate a Phase 2 trial and a Phase 3 trial, build the digital twin in different ways, and compare the estimates of the average treatment effect.</p>
    </div>
    <div class="rule-note">For checking and exploring only. Numbers for a manuscript come from the R engine, not from this page.</div>
  </div>

  <div class="layout">
    <div id="setup"></div>
    <main>
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="panel" id="tab-trial"></div>
      <div class="panel" id="tab-sim" hidden></div>
      <div class="panel" id="tab-data" hidden></div>
      <div class="panel" id="tab-log" hidden></div>
      <div class="panel guide" id="tab-guide" hidden></div>
    </main>
  </div>
</div>
<div id="tip" hidden></div>

<script>
// =============================================================================
// core.js  --  numerical core of the PREDCOVA Cross-Fit Lab
// =============================================================================
// Written from the formulas of the PREDCOVA paper and the pre-specification
// note, NOT translated from functions.R. No DOM access: the same code runs in
// the page, in Web Workers and in a command-line JavaScript engine.
//
// Sections
//   1. random numbers          5. SBML twin learner
//   2. probability functions   6. twins and folds
//   3. formula parser          7. estimators
//   4. data model              8. one repetition, summaries, benchmarks
//   9. self-tests
// =============================================================================
function coreFactory() {
'use strict';
const EPS = 2.220446049250313e-16;

// ---------------------------------------------------------------------------
// 1. RANDOM NUMBERS  (xoshiro128**, seeded by splitmix32)
// ---------------------------------------------------------------------------
// makeRng(seed, a, b): one independent stream per (seed, a, b). The tool uses
// a = repetition number, b = sweep point, so a repetition gives the same data
// whatever the number of workers or the methods switched on.
function makeRng(seed, a, b, salt) {
  let h = seed >>> 0;
  const sm = () => { h = (h + 0x9E3779B9) >>> 0; let z = h;
    z = Math.imul(z ^ (z >>> 16), 0x85EBCA6B); z = Math.imul(z ^ (z >>> 13), 0xC2B2AE35);
    return (z ^ (z >>> 16)) >>> 0; };
  h = (sm() ^ Math.imul((a >>> 0) + 1, 0x9E3779B1)) >>> 0;
  h = (sm() ^ Math.imul((b >>> 0) + 1, 0x85EBCA77)) >>> 0;
  let s0 = sm(), s1 = sm(), s2 = sm(), s3 = sm();
  // salt (twin streams of forest and boosting): changes one state word, so such a stream can never equal a data stream
  if (salt) s3 = (s3 ^ salt) >>> 0;
  if (!(s0 | s1 | s2 | s3)) s0 = 1;
  const rotl = (x, k) => (x << k) | (x >>> (32 - k));
  const u32 = () => { const r = Math.imul(rotl(Math.imul(s1, 5), 7), 9) >>> 0, t = s1 << 9;
    s2 ^= s0; s3 ^= s1; s1 ^= s2; s0 ^= s3; s2 ^= t; s3 = rotl(s3, 11); return r; };
  const unif = () => { let u;                       // uniform on (0, 1), 53 bits
    do { const hi = u32() >>> 5, lo = u32() >>> 6; u = (hi * 67108864 + lo) / 9007199254740992; } while (u === 0);
    return u; };
  let spare = null;
  const norm = () => {                              // polar Box-Muller
    if (spare !== null) { const s = spare; spare = null; return s; }
    let u, v, q;
    do { u = 2 * unif() - 1; v = 2 * unif() - 1; q = u * u + v * v; } while (q >= 1 || q === 0);
    const f = Math.sqrt(-2 * Math.log(q) / q); spare = v * f; return u * f; };
  const gamma = (shape, rate) => {                  // Marsaglia-Tsang
    if (shape < 1) return gamma(shape + 1, rate) * Math.pow(unif(), 1 / shape);
    const d = shape - 1 / 3, c = 1 / Math.sqrt(9 * d);
    for (;;) { const x = norm(), v0 = 1 + c * x; if (v0 <= 0) continue;
      const v = v0 * v0 * v0, u = unif();
      if (u < 1 - 0.0331 * x * x * x * x || Math.log(u) < 0.5 * x * x + d * (1 - v + Math.log(v))) return d * v / rate; } };
  const shuffle = (arr) => { for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(unif() * (i + 1)), t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; };
  return { unif, norm, gamma, shuffle };
}

// ---------------------------------------------------------------------------
// 2. PROBABILITY FUNCTIONS
// ---------------------------------------------------------------------------
// Standard normal: returns [P(Z <= x), P(Z > x)]. Series for |x| <= 3,
// continued fraction for the tail beyond 3.
function pnormBoth(x) {
  const ax = Math.abs(x), phi = Math.exp(-0.5 * ax * ax) / 2.5066282746310002;
  let up;
  if (ax <= 3) { let term = ax, sum = ax;
    for (let k = 1; k < 300; k++) { term *= ax * ax / (2 * k + 1); sum += term; if (term < sum * 1e-17) break; }
    up = 0.5 - phi * sum;
  } else { let cf = 0; for (let k = 200; k >= 1; k--) cf = k / (ax + cf); up = phi / (ax + cf); }
  return x >= 0 ? [1 - up, up] : [up, 1 - up];
}
function qnorm(p) {                                  // bisection, enough for critical values
  let lo = -40, hi = 40;
  for (let i = 0; i < 200; i++) { const mid = 0.5 * (lo + hi); if (pnormBoth(mid)[0] < p) lo = mid; else hi = mid; }
  return 0.5 * (lo + hi);
}
function lgamma(x) {                                 // Lanczos, g = 7
  const c = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313,
    -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
  if (x < 0.5) return Math.log(Math.PI / Math.sin(Math.PI * x)) - lgamma(1 - x);
  x -= 1; let a = c[0]; const t = x + 7.5;
  for (let i = 1; i < 9; i++) a += c[i] / (x + i);
  return 0.5 * Math.log(2 * Math.PI) + (x + 0.5) * Math.log(t) - t + Math.log(a);
}
function betacf(a, b, x) {                           // continued fraction of the incomplete beta
  const TINY = 1e-300, qab = a + b, qap = a + 1, qam = a - 1;
  let c = 1, d = 1 - qab * x / qap; if (Math.abs(d) < TINY) d = TINY; d = 1 / d; let h = d;
  for (let m = 1; m <= 1000; m++) { const m2 = 2 * m;
    let aa = m * (b - m) * x / ((qam + m2) * (a + m2));
    d = 1 + aa * d; if (Math.abs(d) < TINY) d = TINY; c = 1 + aa / c; if (Math.abs(c) < TINY) c = TINY; d = 1 / d; h *= d * c;
    aa = -(a + m) * (qab + m) * x / ((a + m2) * (qap + m2));
    d = 1 + aa * d; if (Math.abs(d) < TINY) d = TINY; c = 1 + aa / c; if (Math.abs(c) < TINY) c = TINY; d = 1 / d;
    const del = d * c; h *= del; if (Math.abs(del - 1) < 3e-16) break; }
  return h;
}
function betai(a, b, x) {                            // regularized incomplete beta I_x(a, b)
  if (x <= 0) return 0; if (x >= 1) return 1;
  const bt = Math.exp(lgamma(a + b) - lgamma(a) - lgamma(b) + a * Math.log(x) + b * Math.log(1 - x));
  return x < (a + 1) / (a + b + 2) ? bt * betacf(a, b, x) / a : 1 - bt * betacf(b, a, 1 - x) / b;
}
// two-sided p-value of a t statistic with df degrees of freedom
function pt2(t, df) { return betai(df / 2, 0.5, df / (df + t * t)); }

// ---------------------------------------------------------------------------
// 3. FORMULA PARSER  (no eval; safe for formulas typed by any user)
// ---------------------------------------------------------------------------
// Operators: + - * / ^, comparisons (< > <= >= == !=) that return 1 or 0,
// & | !, parentheses. Functions: see FUNS. Constant: pi.
// As in R, a leading ! applies to the whole comparison: !a > b means !(a > b).
// A function called with the wrong number of arguments is an error.
// compileExpr("0.7*cos(x1)", ["x1"]) returns a function of the covariate row.
const FUNS = { sin: Math.sin, cos: Math.cos, tan: Math.tan, exp: Math.exp, log: Math.log, sqrt: Math.sqrt,
  abs: Math.abs, floor: Math.floor, min: Math.min, max: Math.max, pow: Math.pow,
  expit: x => 1 / (1 + Math.exp(-x)), pnorm: x => pnormBoth(x)[0], ind: x => (x ? 1 : 0) };
const ARITY = { min: [2, 99], max: [2, 99], pow: [2, 2] };          // every other function takes exactly one argument
const CMP = { '<': (a, b) => a < b, '>': (a, b) => a > b, '<=': (a, b) => a <= b, '>=': (a, b) => a >= b,
  '==': (a, b) => a === b, '!=': (a, b) => a !== b };
function compileExpr(src, vars) {
  const s = String(src == null ? '' : src), toks = [];
  const re = /\s*(?:(\d+\.?\d*(?:[eE][+-]?\d+)?|\.\d+(?:[eE][+-]?\d+)?)|([A-Za-z_][A-Za-z0-9_.]*)|(<=|>=|==|!=|&&|\|\||[-+*\/^()<>,!&|]))/y;
  let pos = 0;
  while (pos < s.length) {
    re.lastIndex = pos; const m = re.exec(s);
    if (!m) { if (/^\s*$/.test(s.slice(pos))) break; throw new Error('cannot read "' + s.slice(pos, pos + 12) + '"'); }
    if (m[1] !== undefined) toks.push({ t: 'n', v: parseFloat(m[1]) });
    else if (m[2] !== undefined) toks.push({ t: 'id', v: m[2] });
    else toks.push({ t: 'op', v: m[3] });
    pos = re.lastIndex;
  }
  if (!toks.length) throw new Error('formula is empty');
  let k = 0;
  const isOp = (...vs) => toks[k] && toks[k].t === 'op' && vs.indexOf(toks[k].v) >= 0;
  const eat = v => { if (isOp(v)) { k++; return true; } return false; };
  const need = v => { if (!eat(v)) throw new Error('expected "' + v + '"'); };
  function pOr() { let a = pAnd(); while (isOp('|', '||')) { k++; const l = a, r = pAnd(); a = v => ((l(v) || r(v)) ? 1 : 0); } return a; }
  function pAnd() { let a = pNot(); while (isOp('&', '&&')) { k++; const l = a, r = pNot(); a = v => ((l(v) && r(v)) ? 1 : 0); } return a; }
  function pNot() { if (eat('!')) { const a = pNot(); return v => (a(v) ? 0 : 1); } return pCmp(); }
  function pCmp() { const a = pAdd(); if (toks[k] && toks[k].t === 'op' && CMP[toks[k].v]) {
    const c = CMP[toks[k++].v], b = pAdd(); return v => (c(a(v), b(v)) ? 1 : 0); } return a; }
  function pAdd() { let a = pMul(); while (isOp('+', '-')) { const op = toks[k++].v, l = a, r = pMul();
    a = op === '+' ? (v => l(v) + r(v)) : (v => l(v) - r(v)); } return a; }
  function pMul() { let a = pUnary(); while (isOp('*', '/')) { const op = toks[k++].v, l = a, r = pUnary();
    a = op === '*' ? (v => l(v) * r(v)) : (v => l(v) / r(v)); } return a; }
  function pUnary() { if (eat('-')) { const a = pUnary(); return v => -a(v); } if (eat('+')) return pUnary();
    if (eat('!')) { const a = pUnary(); return v => (a(v) ? 0 : 1); } return pPow(); }
  function pPow() { const a = pPrim(); if (eat('^')) { const b = pUnary(); return v => Math.pow(a(v), b(v)); } return a; }
  function pPrim() { const t = toks[k++];
    if (!t) throw new Error('formula ends too early');
    if (t.t === 'n') { const c = t.v; return () => c; }
    if (t.t === 'id') {
      if (eat('(')) { const fn = FUNS[t.v]; if (!fn) throw new Error('unknown function "' + t.v + '"');
        const args = []; if (!eat(')')) { do { args.push(pOr()); } while (eat(',')); need(')'); }
        const ar = ARITY[t.v] || [1, 1];
        if (args.length < ar[0] || args.length > ar[1]) throw new Error(t.v + '() takes ' + (ar[0] === ar[1] ? ar[0] : 'at least ' + ar[0]) + ' argument' + (ar[0] === 1 && ar[1] === 1 ? '' : 's') + ', not ' + args.length);
        if (args.length === 1) { const a0 = args[0]; return v => fn(a0(v)); }
        if (args.length === 2) { const a0 = args[0], a1 = args[1]; return v => fn(a0(v), a1(v)); }
        return v => fn(...args.map(a => a(v))); }
      if (t.v === 'pi') return () => Math.PI;
      const ix = vars.indexOf(t.v); if (ix < 0) throw new Error('unknown name "' + t.v + '"');
      return v => v[ix]; }
    if (t.t === 'op' && t.v === '(') { const a = pOr(); need(')'); return a; }
    throw new Error('unexpected "' + t.v + '"'); }
  const out = pOr();
  if (k < toks.length) throw new Error('unexpected "' + toks[k].v + '"');
  return out;
}

// ---------------------------------------------------------------------------
// 4. DATA MODEL
// ---------------------------------------------------------------------------
// Y = f(x) + g(x) T + sigma(x) e,  e ~ N(0, 1).
// Settings S (plain JSON) hold the covariates, the three formulas, the design,
// the cross-fitting choices and the list of methods. compile(S) checks them.

    c.forEach((v, j) => { const x = parseFloat(v); if (!isFinite(x)) throw new Error(what + ', row ' + (r + 2) + ', column ' + head[j] + ': not a number'); cols[j].push(x); }); });

}

$('tab-guide').innerHTML = '<h2>Guide</h2>' +
  '<p>This page simulates a small Phase 2 trial and a Phase 3 trial from a model you choose, builds a digital twin score in several ways, and compares methods for estimating the average treatment effect in the Phase 3 trial.</p>' +
  '<h3>Quick start</h3><ul><li>Section 1: choose a data model, or type your own.</li><li>Section 2: set the number of patients.</li><li>Press “Run simulation”. The boxes at the top of the results give the answer for the highlighted method in words.</li>' +
  '<li>“Draw one trial” shows a single simulated trial with the twin score and every estimate.</li></ul>' +
  '<h3>What it is for, and what it is not for</h3><ul><li>Use it to try settings quickly, to see what one trial looks like, and to check other software on the same data.</li>' +
  '<li>Do not take manuscript numbers from it. Its random numbers differ from R, and a browser run is small. Reported results come from the R engine.</li><li>Every finished run is written to the run log with its settings and seed. Decide the scenarios for a paper before looking at results.</li></ul>' +
  '<h3>The data model</h3><p class="mono">Y = f(x) + g(x)·T + σ(x)·e,   e ~ N(0, 1)</p><ul><li>f(x): mean outcome under control. g(x): treatment effect for a patient with covariates x. The target is the average effect τ = E[g(x)].</li>' +
  '<li>You type f, g and σ as formulas of the covariates. Each covariate has its own distribution.</li>' +
  '<li>Correlation matrix: one correlation for every pair of covariates (Gaussian copula). The number is the correlation of the underlying normal variables. For two normal covariates it is their correlation. For other distributions the correlation of the covariates themselves is smaller: 0.5 gives about 0.48 for two uniform covariates and about 0.4 when one covariate is skewed or binary. The page refuses a matrix that no set of covariates can have.</li>' +
  '<li>Phase 2 and Phase 3 patients come from the same model. Arm sizes are fixed, not random.</li></ul>' +
  '<h3>The digital twin</h3><p>The twin score h(x) predicts a patient’s outcome under control from the covariates. The learner is chosen per method (section 3) and its settings are in section 4.</p><ul>' +
  '<li><b>SBML</b> (default): <span class="mono">h(x) = Σ w_j(x)·y_j / Σ w_j(x),  w_j(x) = exp(−Σ_k r_k²·(x_k − x_jk)²)</span>. A weighted mean of the training patients’ outcomes; patients similar to x get more weight. The weights r_k are tuned by leave-one-out prediction error (one r at a time; by default the search is on 0.001 to 10 and starts at 1).</li>' +
  '<li><b>Random forest</b>: the mean of many regression trees, each grown on patients drawn with replacement, trying a random third of the covariates at each split.</li>' +
  '<li><b>Gradient boosting</b>: small trees added one after another, each fitted to what the trees before it left unexplained.</li>' +
  '<li><b>Ridge and lasso</b>: linear regression on the covariates with a penalty on the size of the coefficients; the penalty is chosen by leave-one-out prediction error. Lasso can set coefficients to zero.</li>' +
  '<li>Forest, boosting, ridge and lasso are written out in this page from their textbook definitions. A forest or a boosted model does not give the same numbers as an R package, because the random draws differ. The default settings are conventions, not tuned values; with 30 training patients any learner is working at its limit.</li>' +
  '<li>If treated patients are used for training, the arm is one more input and every patient is scored as a control (T = 0).</li><li>A twin is called flat when its score is almost one constant. Such a score carries no information and the analysis is then close to an analysis without a twin.</li></ul>' +
  '<h3>Where a twin gets its training patients</h3><ul><li><b>Phase 2 only</b>: a fixed twin, trained before the Phase 3 trial is seen.</li><li><b>Cross-fitted</b>: the Phase 3 patients are split into K folds. The score of a patient comes from a twin trained on the other folds (plus Phase 2 if chosen). No patient’s own outcome enters that patient’s score.</li>' +
  '<li>Any combination can be set per method in section 3, for PROCOVA or PREDCOVA.</li></ul>' +
  '<h3>The methods and their formulas</h3><p>Section 3 shows, for every method, the fitted model, the estimate and the standard error, written from the current settings.</p><ul>' +
  '<li><b>ANOVA</b>: <span class="mono">Y ~ 1 + T</span>. <b>ANCOVA</b>: <span class="mono">Y ~ 1 + T + x1 + … + xp</span> (every covariate as a linear term). Estimate = coefficient of T. Classical standard error unless changed in section 6, t test.</li>' +
  '<li><b>PROCOVA</b>: <span class="mono">Y ~ 1 + T + h(x)</span>. Estimate = coefficient of T. Robust (HC3) standard error unless changed in section 6, t test.</li>' +
  '<li><b>PREDCOVA</b>: <span class="mono">Y ~ 1 + h(x) + T·z(x)′γ</span>. z(x) is a list of functions of the covariates that you type in section 6; its first element is always 1. Any pre-specified list is admissible. Estimate <span class="mono">τ̂ = mean of z(xᵢ)′γ̂</span>. Variance <span class="mono">z̄′·HC3(γ̂)·z̄ + var(z(xᵢ)′γ̂)/n</span>, z test.</li>' +
  '<li><b>Oracle</b>: <span class="mono">ψᵢ = g(xᵢ) + Tᵢeᵢ/π − (1 − Tᵢ)eᵢ/(1 − π)</span> with the true f and g, <span class="mono">τ̂ = mean of ψᵢ</span>. It marks the best any method can do.</li><li>All intervals are estimate ± 1.96 SE.</li></ul>' +
  '<h3>How the estimate is formed with a cross-fitted twin</h3><ul><li><b>One regression on all patients</b> (default): every patient gets the score from the twin trained without that patient’s fold, and the scores of all folds enter one regression with one coefficient. This is what the R engine does.</li>' +
  '<li><b>Each fold separately, then averaged</b> (sensitivity check): the analysis model is fitted K times, once on the patients of each fold. The estimate is the average of the K estimates weighted by fold size; its variance is the weighted sum of the K variances (a large-sample formula). Test: z for PREDCOVA, t with Satterthwaite degrees of freedom for PROCOVA.</li>' +
  '<li>Fold-by-fold fitting needs enough patients per fold; the page refuses settings where a fold is smaller than the model.</li></ul>' +
  '<h3>How the data are simulated (paired design)</h3><ul><li>Every repetition draws a new Phase 3 trial and a new Phase 2 trial. All twins are trained again, and every method analyses this same pair.</li>' +
  '<li>So a difference between two methods is a paired difference, and no single historical data set is reused across repetitions.</li><li>Order of the random draws in a repetition: Phase 3 patients, Phase 2 patients, folds. Forest and boosting take their random numbers from separate streams, one per twin and fold, so the data and the other methods do not change when a method is switched on or off.</li>' +
  '<li>“Compare several values of” runs the same simulation at several Phase 3 sizes, Phase 2 sizes or numbers of folds. Every size gets its own trials; every K uses the same trials.</li><li>The number of CPU threads changes only the speed.</li></ul>' +
  '<h3>Reading the results</h3><ul><li><b>Power</b>: share of repetitions with p below α when there is an effect. <b>Type I error</b>: the same share when the effect is switched off (section 1); it should be α.</li>' +
  '<li><b>Coverage</b>: share of repetitions whose 95% interval contains the true effect; it should be 95%. With an effect it is the usual check of validity; a 95% interval that covers 95% of the time is a 5% test of the true value.</li>' +
  '<li><b>Patients saved</b> = Phase 3 size × (1 − variance of the estimate ÷ variance of the reference). It is the number of patients the method can do without and still be as precise as the reference method. It assumes the variance falls in proportion to 1 / size. Its range comes from the Monte Carlo error of the variance ratio and is approximate.</li>' +
  '<li><b>The wording in the boxes follows two fixed rules.</b> A rate is called consistent with its target when it lies within 1.96 Monte Carlo standard errors of the target. A difference from the reference is named higher, lower or a saving only when it is beyond 1.96 of its Monte Carlo standard error; otherwise the box says it is not distinguishable at this number of repetitions.</li>' +
  '<li>“Technical details” holds bias, N × variance (comparable across trial sizes and with the benchmarks), mean SE ÷ true SD (1 is ideal; below 1 the method is too optimistic), twin R (correlation of twin score and outcome among Phase 3 controls) and the share of flat twins.</li></ul>' +
  '<h3>Precision of a browser run</h3><p>With 500 repetitions a power estimate has a standard error of about 2 points, with 2,000 about 1 point. Paired differences between methods are more precise, but differences below one point need far more repetitions than a browser run.</p>' +
  '<h3>Presets</h3><p>The first three presets are the one-, two- and three-covariate models of the first PREDCOVA paper. The seven-covariate presets follow the published simulation model of Højbjerre-Frandsen and Schuler; the covariates x1 to x7 here are W1 to W7 of that paper. Check the formulas against the source before relying on them.</p>';

renderSetup(); renderData(); renderLog(); renderSim(); selectTab('trial'); drawTrial();
if (!TRIAL) renderTrial();
window.PCL = { CORE: CORE, state: () => ({ ST, SIM, TRIAL }), runSim, renderSetup, drawTrial };
})();
